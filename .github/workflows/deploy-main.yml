name: pipeline-de-deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala a Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy no Netlify
        env:
          AUTH_TOKE: ${{ secrets.AUTH_TOKEN }}
          PROJECT_ID: ${{ secrets.MAIN_NETLIFY_ID }}
        run: netlify deploy --site=$PROJECT_ID --auth=$AUTH_TOKE --dir="." --prod
